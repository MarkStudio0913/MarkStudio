# 策略：
#   - npm minor/patch 归组为一个 PR，减少噪音
#   - Electron / Vditor / electron-builder 的 major 版本需要专门迁移和打包验证，
#     暂时忽略自动 major PR；常规 minor/patch 和安全更新仍由 Dependabot 提交
#   - Actions 按周更新；每周一次，避免频繁打扰
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: vditor
        update-types: ["version-update:semver-major"]
      - dependency-name: electron-builder
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

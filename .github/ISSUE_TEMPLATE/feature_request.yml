name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出建议前请先搜索现有 Issue，并留意 README 中「功能特性」与
        [docs/使用说明.md](https://github.com/MarkStudio0913/MarkStudio/blob/main/docs/%E4%BD%BF%E7%94%A8%E8%AF%B4%E6%98%8E.md) —— 有些需求可能已经支持。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述痛点，而不是直接给方案——先讲清楚「为什么需要」更有助于讨论
      placeholder: 我在……的时候，不得不……，这很麻烦，因为……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在你是怎么绕开这个问题的？
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围自查
      description: 请确认你的建议符合本项目的定位
      options:
        - label: 该功能可以完全离线工作，不依赖运行时网络请求
          required: false
        - label: 我愿意提交 PR 来实现它
          required: false
